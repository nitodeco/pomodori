  <path d="M256 120 Q312 90 342 100 Q322 110 312 130 Q292 115 256 120" fill="#2ECC71"/>
  <path d="M256 115 Q230 70 210 65 Q225 85 235 110 Q245 100 256 115" fill="#27AE60"/>
